[package]
name = "autumn-homepage"
version = "0.1.0"
authors = ["hyziri <hyziri@protonmail.com>"]
edition = "2021"
repository = "https://github.com/hyziri/homepage"

[workspace]
members = [".", "migration", "entity"]

[dependencies]
dioxus = { version = "0.6.3", features = ["fullstack", "router"] }
dioxus-logger = "0.6.2"
dioxus-document = { version = "0.6.3" }
dioxus-free-icons = { version = "0.9.0", features = [
    "font-awesome-brands",
    "font-awesome-solid",
] }
dioxus-charts = "0.3.1"

serde = { version = "1.0.227", features = ["derive"] }
chrono = { version = "0.4.42", features = ["serde"] }

# === Web ===
reqwasm = { version = "0.5.0", optional = true }

# === Server ===
migration = { path = "migration", optional = true }
entity = { path = "entity", optional = true }

# Use older version until Dioxus 0.7 release
axum = { version = "0.7.9", optional = true }

tokio = { version = "1.47.1", features = ["macros"], optional = true }
sea-orm = { version = "1.1.16", optional = true }
dioxus-cli-config = { version = "0.6.3", optional = true }

# Use older version until axum is updated to latest version
utoipa = { version = "4.2.3", optional = true, features = ["axum_extras"] }
utoipa-swagger-ui = { version = "7.1.0", features = ["axum"], optional = true }

log = { version = "0.4.28", optional = true }
thiserror = { version = "2.0.16", optional = true }
dotenvy = { version = "0.15.7", optional = true }
tokio-cron-scheduler = { version = "0.14.0", optional = true }
eve_esi = { version = "0.4.5", optional = true }

[dev-dependencies]
mockito = "1.7.0"
serde_json = "1.0.145"

[features]
default = []
web = ["dioxus/web", "reqwasm"]
server = [
    "dioxus/server",
    "migration",
    "entity",
    "axum",
    "tokio",
    "sea-orm",
    "dioxus-cli-config",
    "utoipa",
    "utoipa-swagger-ui",
    "log",
    "thiserror",
    "dotenvy",
    "tokio-cron-scheduler",
    "eve_esi",
]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
