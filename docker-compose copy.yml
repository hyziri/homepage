services:
  autumn-homepage:
    build: ./web
    restart: unless-stopped
    environment:
      - API_URL=https://${DOMAIN}/api
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN}`) && !PathPrefix(`/api`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=primary
      - traefik.http.services.web.loadbalancer.server.port=8080
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -H 'Accept: text/html' http://localhost:8080 || exit 1",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - autumn-homepage-api
    networks:
      - autumn_homepage
      - traefik

  autumn-homepage-api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=primary
      - traefik.http.routers.api.middlewares=strip-api-prefix
      - traefik.http.middlewares.strip-api-prefix.stripprefix.prefixes=/api
      - traefik.http.services.api.loadbalancer.server.port=8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -H 'Accept: text/html' http://localhost:8000 || exit 1",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - postgres
    networks:
      - autumn_homepage
      - traefik

  postgres:
    image: postgres:latest
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autumn_homepage

volumes:
  postgres_data:

networks:
  autumn_homepage:
  traefik:
    external: true
