[package]
name = "autumn-homepage-api"
repository = "https://github.com/hyziri/homepage-api"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration", "entity"]

[dependencies]
migration = { path = "migration"}
entity = { path = "entity"}

# Autumn Crates
eve_esi = "0.4.5"

# Model dependencies
serde = "1.0.225"
chrono = "0.4.42"

# API dependencies
axum = "0.8.4"
sea-orm = "1.1.16"
tokio = { version = "1.47.1", features = ["rt-multi-thread"]}
tokio-cron-scheduler = "0.14.0"
log = "0.4.28"
dotenvy = "0.15.7"
env_logger = "0.11.8"
thiserror = "2.0.16"

# Documentation
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
utoipa-axum = "0.2.0"
